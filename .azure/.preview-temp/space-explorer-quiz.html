<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우주 탐험 퀴즈 — 오르빗 아카데미</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div class="quiz-shell">
    <header class="quiz-brand" aria-label="오르빗 아카데미">
      <span class="quiz-brand-mark" aria-hidden="true">
        <svg class="preview-icon preview-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5 14.1 9.9 20.5 12l-6.4 2.1L12 20.5l-2.1-6.4L3.5 12l6.4-2.1L12 3.5Z"></path>
        </svg>
      </span>
      오르빗 아카데미
    </header>

    <main class="quiz-card" aria-labelledby="question-title">
      <div class="quiz-top">
        <p class="quiz-eyebrow">우주 탐험 퀴즈</p>
        <span class="quiz-pill">
          <svg class="preview-icon preview-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"></path>
          </svg>
          2점
        </span>
      </div>

      <div class="quiz-progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3">
        <span></span>
      </div>

      <p class="quiz-eyebrow">3번째 질문 · 총 10문제</p>
      <h1 class="quiz-title" id="question-title">가장 뚜렷한 고리를 가진 <span>행성은 무엇일까요?</span></h1>
      <p class="quiz-copy">정답을 골라 태양계 여행을 계속해 보세요.</p>

      <section class="quiz-question" aria-label="Answer choices">
        <div class="quiz-answers">
          <button class="quiz-answer" type="button">A&nbsp;&nbsp; 천왕성</button>
          <button class="quiz-answer" type="button">B&nbsp;&nbsp; 목성</button>
          <button class="quiz-answer quiz-answer--correct" type="button">C&nbsp;&nbsp; 토성</button>
          <button class="quiz-answer" type="button">D&nbsp;&nbsp; 지구</button>
        </div>
        <p class="quiz-feedback" role="status">정답이에요! 토성의 고리는 대부분 수많은 얼음 조각으로 이루어져 있어요.</p>
      </section>

      <div class="quiz-bottom">
        <button class="quiz-action" type="button">다음 문제 <span aria-hidden="true">→</span></button>
      </div>
    </main>
  </div>
</body>
</html>
